name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Verify .NET SDK
        shell: powershell
        run: |
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            Write-Error ".NET SDK not found on this runner. Install once: winget install Microsoft.DotNet.SDK.10"
            exit 1
          }
          dotnet --version

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build driver
        run: npm run build

      - name: Install Appium
        shell: powershell
        run: |
          if (-not (Get-Command appium -ErrorAction SilentlyContinue)) {
            npm install -g appium@3.5.0
          } else {
            Write-Host "Appium already installed: $(appium --version)"
          }

      - name: Install driver into Appium
        shell: powershell
        run: |
          $installed = appium driver list --installed --json | ConvertFrom-Json
          if ($installed.PSObject.Properties.Name -contains "wincore") {
            appium driver uninstall wincore
          }
          appium driver install --source=local $PWD

      - name: Install Windows Calculator
        shell: powershell
        run: |
          if (Get-AppxPackage -Name "Microsoft.WindowsCalculator" -ErrorAction SilentlyContinue) {
            Write-Host "Calculator already installed, skipping"
          } else {
            winget install --id 9WZDNCRFHVN5 --source msstore --accept-source-agreements --accept-package-agreements --silent
          }

      - name: Install Windows Notepad
        shell: powershell
        run: |
          if (Get-AppxPackage -Name "Microsoft.WindowsNotepad" -ErrorAction SilentlyContinue) {
            Write-Host "Notepad already installed, skipping"
          } else {
            winget install --id 9MSMLRH6LZF3 --source msstore --accept-source-agreements --accept-package-agreements --silent
          }

      - name: Verify Google Chrome
        shell: powershell
        run: |
          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          if (-not ($chromePaths | Where-Object { Test-Path $_ })) {
            Write-Error "Google Chrome not found on this runner. Install it manually, then re-run."
            exit 1
          }

      - name: Start Appium and run E2E tests
        shell: powershell
        run: |
          $appiumPath = (Get-Command appium.cmd).Source
          $proc = Start-Process -FilePath $appiumPath `
            -ArgumentList "--log-level","info" `
            -RedirectStandardOutput "appium.log" `
            -RedirectStandardError "appium-err.log" `
            -PassThru -WindowStyle Hidden

          $timeout = 60
          $elapsed = 0
          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            if ($proc.HasExited) {
              Write-Error "Appium exited early (code $($proc.ExitCode))"
              Get-Content "appium.log" -ErrorAction SilentlyContinue
              Get-Content "appium-err.log" -ErrorAction SilentlyContinue
              exit 1
            }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:4723/status" -UseBasicParsing -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "Appium ready after ${elapsed}s"
                break
              }
            } catch {}
          } while ($elapsed -lt $timeout)

          if ($elapsed -ge $timeout) {
            Write-Error "Appium did not start within ${timeout}s"
            Get-Content "appium.log" -ErrorAction SilentlyContinue
            Get-Content "appium-err.log" -ErrorAction SilentlyContinue
            exit 1
          }

          # TEMPORARY: scoped to the failing test only for live debugging on the
          # runner. Revert to the full suite below once it's fixed.
          npx vitest run --config vitest.e2e.config.ts `
            test/e2e/actions.e2e.ts -t "wheel scroll"
          # npx vitest run --config vitest.e2e.config.ts `
          #   test/e2e/extension-powershell.e2e.ts `
          #   test/e2e/extension-webview.e2e.ts `
          #   test/e2e/actions.e2e.ts `
          #   test/e2e/element-commands.e2e.ts `
          #   test/e2e/extension-app-lifecycle.e2e.ts

      - name: Publish E2E test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: test-results/e2e-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Appium logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: |
            appium.log
            appium-err.log
